<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MP3 Player</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js"></script>
</head>
<body>
    <div class="player-container">
        <div class="player-header">
            <h1>🎵 MP3 PLAYER</h1>
        </div>

        <div class="player-display">
            <div class="song-info">
                <h2 id="current-song">No song selected</h2>
                <p id="song-time">00:00 / 00:00</p>
            </div>
            <div class="progress-bar">
                <div id="progress" class="progress-fill"></div>
            </div>
        </div>

        <div class="playlist">
            <h3>My Song List</h3>
            <div id="song-list" class="song-list">
                <p class="placeholder">Loading songs...</p>
            </div>
        </div>

        <div class="controls">
            <button id="play-btn" class="control-btn" disabled>▶ Play</button>
            <button id="pause-btn" class="control-btn" disabled>⏸ Pause</button>
            <button id="stop-btn" class="control-btn" disabled>⏹ Stop</button>
        </div>

        <audio id="audio-player" crossorigin="anonymous"></audio>
    </div>

    <script src="script.js"></script>
</body>
</html>
